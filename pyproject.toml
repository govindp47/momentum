[project]
name = "momentum"
version = "0.1.0"
description = "A local-first personal tracking application combining daily commitments and long-term journeys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "platformdirs>=4.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "rich>=13.7",
    "typer[all]>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
momentum = "momentum.cli.main:main"
momentum-server = "momentum.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum"]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
]
ignore = [
    "B008",  # function calls in argument defaults — FastAPI/Typer patterns
    "UP007", # use X | Y for type hints — compatibility
    "N818",  # Exception names without Error suffix — intentional domain naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",  # test signatures can be long
    "F841",  # unused variables in test helpers
    "B017",  # blind exception acceptable in tests with context
    "C408",  # dict() can be clearer in test factories
    "C901",  # complex test structures are acceptable
]

"src/momentum/storage/migrations.py" = [
    "E501",  # SQL DDL lines cannot always be wrapped
]

"src/momentum/stride/presentation/*.py" = [
    "E501",  # Rich markup strings and f-strings
]

"src/momentum/ledger/cli/*.py" = [
    "E501",  # CLI help strings and composite expressions
    "B904",  # typer.Exit() in exception handlers
    "E402",  # deferred imports in CLI commands
    "F841",  # unused CLI handler variables
]

"src/momentum/stride/cli/*.py" = [
    "E501",  # CLI help strings and composite expressions
    "B904",  # typer.Exit() in exception handlers
    "E402",  # deferred imports in CLI commands
    "F841",  # unused CLI handler variables
]

[tool.ruff.lint.isort]
known-first-party = ["momentum"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["momentum"]
omit = ["tests/*"]